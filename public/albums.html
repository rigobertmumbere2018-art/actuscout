<meta name="twitter:card" content="summary"><title>Albums photos | ActuScout</title><style>
:root{--purple:#321b59;--paper:#f7f5f9;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--purple);color:#fff;font:15px/1.55 Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 42px));margin:auto}.top{background:#261342;padding:10px 0;color:#d8cde7;font-size:12px}.top .wrap{display:flex;justify-content:space-between}.head{border-bottom:1px solid var(--line);padding:22px 0}.head .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:22px;font-weight:900;letter-spacing:.02em}.back{font-size:13px;color:#e0d7e9}.intro{padding:48px 0 24px}.eyebrow{color:#d7c9e8;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.intro h1{font-size:clamp(34px,5vw,54px);line-height:1.05;margin:12px 0}.intro p{color:#ded4e8;max-width:650px}.albums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:20px 0 70px}.album{position:relative;min-height:290px;background:#4a2b75;overflow:hidden;border-radius:3px}.album>img{width:100%;height:290px;object-fit:cover;display:block;opacity:.88;transition:transform .35s}.album:hover>img{transform:scale(1.04)}.album-info{position:absolute;inset:auto 0 0;padding:20px;background:linear-gradient(transparent,rgba(20,8,35,.94))}.album-info small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ddcbed}.album-info h2{font-size:20px;line-height:1.2;margin:6px 0}.album-info p{font-size:12px;color:#eee;margin:0}.thumbs{display:flex;gap:7px;margin-top:12px}.thumbs button{width:48px;height:42px;border:1px solid rgba(255,255,255,.5);padding:0;background:transparent;cursor:pointer}.thumbs img{width:100%;height:100%;object-fit:cover}.open-gallery{margin-top:10px;border:1px solid rgba(255,255,255,.55);padding:7px 10px;background:transparent;color:white;cursor:pointer;font-size:11px}.empty{color:#ddd2e9;padding:25px 0}.lightbox{position:fixed;inset:0;background:rgba(10,5,18,.94);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.lightbox.open{display:flex}.lightbox img,.lightbox video{max-width:min(100%,1100px);max-height:82vh;object-fit:contain}.video-thumb{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#241239;color:#fff;font-size:10px;font-weight:800}.close,.move{position:absolute;border:1px solid #fff;background:transparent;color:#fff;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer}.close{right:22px;top:22px}.move.prev{left:20px}.move.next{right:20px}.count{position:absolute;bottom:20px;color:#fff;font-size:13px}@media(max-width:760px){.albums{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.album,.album>img{min-height:220px;height:220px}.album-info{padding:13px}.album-info h2{font-size:16px}}@media(max-width:460px){.albums{grid-template-columns:1fr}.album,.album>img{height:260px;min-height:260px}.wrap{width:calc(100% - 30px)}}

/* Étape 3 — galerie responsive */
@media(max-width:760px){.top .wrap{flex-wrap:wrap;gap:8px}.head .wrap{align-items:flex-start;flex-wrap:wrap}.lightbox{padding:58px 12px 54px}.lightbox img,.lightbox video{max-width:100%;max-height:76vh}.move{width:38px;height:38px;background:rgba(30,15,48,.72)}.move.prev{left:8px}.move.next{right:8px}.close{right:10px;top:10px}}
@media(max-width:460px){.intro{padding:32px 0 18px}.intro h1{font-size:36px}.albums{gap:14px;padding-bottom:42px}.album-info{padding:14px}.thumbs{gap:6px;flex-wrap:wrap}.thumbs button{width:44px;height:40px}.open-gallery{max-width:100%;white-space:normal}.count{bottom:12px}}

</style></head><body><div class="top"><div class="wrap"><span>ACTUALITÉS SCOUTES · AFRIQUE ET MONDE</span><a href="/">Accueil ActuScout</a></div></div><header class="head"><div class="wrap"><a class="brand" href="/">ActuScout</a><a class="back" href="/">← Retour à l’accueil</a></div></header><main class="wrap"><section class="intro"><div class="eyebrow">En images</div><h1>Tous les albums photos</h1><p>Revivez les camps, rassemblements, formations et actions qui font vivre le scoutisme à travers les communautés.</p></section><section class="albums" id="allAlbums"><p class="empty">Chargement des albums…</p></section></main><div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" aria-label="Fermer">×</button><button class="move prev" aria-label="Photo précédente">‹</button><img alt="Photo de la galerie"><button class="move next" aria-label="Photo suivante">›</button><span class="count"></span></div><script>
(async()=>{
 const root=document.querySelector('#allAlbums'),lb=document.querySelector('#lightbox');
 if(!root||!lb)return;
 let photos=[],index=0;
 const isVideo=ph=>String(ph?.mime_type||'').startsWith('video/');
 const mediaUrl=ph=>String(ph?.public_url||'');
 const show=()=>{
  const ph=photos[index];if(!ph)return;
  const old=lb.querySelector('img,video');
  if(old)old.remove();
  let media;
  if(isVideo(ph)){
   media=document.createElement('video');media.controls=true;media.autoplay=true;media.playsInline=true;media.preload='metadata';
  }else{
   media=document.createElement('img');media.alt='Photo de la galerie ActuScout';media.decoding='async';
  }
  media.src=mediaUrl(ph);lb.insertBefore(media,lb.querySelector('.count'));
  lb.querySelector('.count').textContent=(index+1)+' / '+photos.length;
  const prev=lb.querySelector('.prev'),next=lb.querySelector('.next');
  prev.disabled=photos.length<2;next.disabled=photos.length<2;
 };
 const open=(list,i)=>{
  photos=(Array.isArray(list)?list:[]).filter(ph=>mediaUrl(ph));
  if(!photos.length)return;
  index=Math.max(0,Math.min(i,photos.length-1));show();
  lb.classList.add('open');lb.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
 };
 const close=()=>{
  lb.classList.remove('open');lb.setAttribute('aria-hidden','true');
  const media=lb.querySelector('img,video');if(media){if(media.tagName==='VIDEO')media.pause();media.remove()}
  document.body.style.overflow='';
 };
 const move=delta=>{if(photos.length<2)return;index=(index+delta+photos.length)%photos.length;show()};
 lb.querySelector('.close').onclick=close;
 lb.querySelector('.prev').onclick=()=>move(-1);
 lb.querySelector('.next').onclick=()=>move(1);
 lb.addEventListener('click',e=>{if(e.target===lb)close()});
 document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')close();
  if(e.key==='ArrowLeft')move(-1);
  if(e.key==='ArrowRight')move(1);
 });
 try{
  const response=await fetch('/api/public/albums',{headers:{accept:'application/json'},cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const albums=await response.json();
  if(!Array.isArray(albums))throw new Error('Réponse albums invalide');
  root.replaceChildren();
  if(!albums.length){root.innerHTML='<p class="empty">Aucun album publié pour le moment.</p>';return}
  for(const album of albums){
   const list=Array.isArray(album.photos)?album.photos.filter(ph=>mediaUrl(ph)):[];
   const firstImage=list.find(ph=>!isVideo(ph));
   const cover=album.cover_url||(firstImage&&firstImage.public_url);
   const card=document.createElement('article');card.className='album';
   if(cover){
    const image=document.createElement('img');image.src=cover;image.alt=album.title||'Album ActuScout';image.loading='lazy';image.decoding='async';
    image.onerror=()=>{image.hidden=true};card.appendChild(image);
   }
   const info=document.createElement('div');info.className='album-info';
   const date=document.createElement('small');date.textContent=album.event_date||'Album photo';
   const title=document.createElement('h2');title.textContent=album.title||'Album sans titre';
   const description=document.createElement('p');description.textContent=album.description||'';
   info.append(date,title,description);
   if(list.length){
    const thumbs=document.createElement('div');thumbs.className='thumbs';
    list.slice(0,4).forEach((ph,i)=>{
     const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',(isVideo(ph)?'Lire la vidéo ':'Agrandir la photo ')+(i+1));
     if(isVideo(ph)){
      const badge=document.createElement('span');badge.className='video-thumb';badge.textContent='VIDÉO';button.appendChild(badge);
     }else{
      const image=document.createElement('img');image.src=mediaUrl(ph);image.alt='';image.loading='lazy';button.appendChild(image);
     }
     button.onclick=()=>open(list,i);thumbs.appendChild(button);
    });
    info.appendChild(thumbs);
    const more=document.createElement('button');more.type='button';more.className='open-gallery';more.textContent='Ouvrir l’album · '+list.length+' média(s)';more.onclick=()=>open(list,0);info.appendChild(more);
   }else{
    const empty=document.createElement('p');empty.className='album-no-photos';empty.textContent='Les photos de cet album seront bientôt disponibles.';info.appendChild(empty);
   }
   card.appendChild(info);root.appendChild(card);
  }
 }catch(error){
  root.innerHTML='<p class="empty" role="alert">Impossible de charger les albums pour le moment. Vérifiez votre connexion puis réessayez.</p>';
  console.error('ActuScout — chargement galerie :',error);
 }
})();
</script></body></html>

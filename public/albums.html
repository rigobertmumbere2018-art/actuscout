<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#321b59"><meta name="description" content="Explorez les albums photos ActuScout : camps, rassemblements, formations et actions scoutes."><title>Albums photos | ActuScout</title><style>
:root{--purple:#321b59;--paper:#f7f5f9;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;background:var(--purple);color:#fff;font:15px/1.55 Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 42px));margin:auto}.top{background:#261342;padding:10px 0;color:#d8cde7;font-size:12px}.top .wrap{display:flex;justify-content:space-between}.head{border-bottom:1px solid var(--line);padding:22px 0}.head .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:22px;font-weight:900;letter-spacing:.02em}.back{font-size:13px;color:#e0d7e9}.intro{padding:48px 0 24px}.eyebrow{color:#d7c9e8;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.intro h1{font-size:clamp(34px,5vw,54px);line-height:1.05;margin:12px 0}.intro p{color:#ded4e8;max-width:650px}.albums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:20px 0 70px}.album{position:relative;min-height:290px;background:#4a2b75;overflow:hidden;border-radius:3px}.album>img{width:100%;height:290px;object-fit:cover;display:block;opacity:.88;transition:transform .35s}.album:hover>img{transform:scale(1.04)}.album-info{position:absolute;inset:auto 0 0;padding:20px;background:linear-gradient(transparent,rgba(20,8,35,.94))}.album-info small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ddcbed}.album-info h2{font-size:20px;line-height:1.2;margin:6px 0}.album-info p{font-size:12px;color:#eee;margin:0}.thumbs{display:flex;gap:7px;margin-top:12px}.thumbs button{width:48px;height:42px;border:1px solid rgba(255,255,255,.5);padding:0;background:transparent;cursor:pointer}.thumbs img{width:100%;height:100%;object-fit:cover}.open-gallery{margin-top:10px;border:1px solid rgba(255,255,255,.55);padding:7px 10px;background:transparent;color:white;cursor:pointer;font-size:11px}.empty{color:#ddd2e9;padding:25px 0}.lightbox{position:fixed;inset:0;background:rgba(10,5,18,.94);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.lightbox.open{display:flex}.lightbox img{max-width:min(100%,1100px);max-height:82vh;object-fit:contain}.close,.move{position:absolute;border:1px solid #fff;background:transparent;color:#fff;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer}.close{right:22px;top:22px}.move.prev{left:20px}.move.next{right:20px}.count{position:absolute;bottom:20px;color:#fff;font-size:13px}@media(max-width:760px){.albums{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.album,.album>img{min-height:220px;height:220px}.album-info{padding:13px}.album-info h2{font-size:16px}}@media(max-width:460px){.albums{grid-template-columns:1fr}.album,.album>img{height:260px;min-height:260px}.wrap{width:calc(100% - 30px)}}
</style></head><body><div class="top"><div class="wrap"><span>ACTUALITÉS SCOUTES · AFRIQUE ET MONDE</span><a href="/">Accueil ActuScout</a></div></div><header class="head"><div class="wrap"><a class="brand" href="/">ActuScout</a><a class="back" href="/">← Retour à l’accueil</a></div></header><main class="wrap"><section class="intro"><div class="eyebrow">En images</div><h1>Tous les albums photos</h1><p>Revivez les camps, rassemblements, formations et actions qui font vivre le scoutisme à travers les communautés.</p></section><section class="albums" id="allAlbums"><p class="empty">Chargement des albums…</p></section></main><div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" aria-label="Fermer">×</button><button class="move prev" aria-label="Photo précédente">‹</button><img alt="Photo de la galerie"><button class="move next" aria-label="Photo suivante">›</button><span class="count"></span></div><script>
(async()=>{const root=document.querySelector('#allAlbums'),lb=document.querySelector('#lightbox');let photos=[],index=0;const show=()=>{lb.querySelector('img').src=photos[index].public_url;lb.querySelector('.count').textContent=(index+1)+' / '+photos.length};const open=(list,i)=>{photos=list;index=i;show();lb.classList.add('open');lb.setAttribute('aria-hidden','false')};const close=()=>{lb.classList.remove('open');lb.setAttribute('aria-hidden','true')};lb.querySelector('.close').onclick=close;lb.querySelector('.prev').onclick=()=>{index=(index-1+photos.length)%photos.length;show()};lb.querySelector('.next').onclick=()=>{index=(index+1)%photos.length;show()};lb.addEventListener('click',e=>{if(e.target===lb)close()});document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')lb.querySelector('.prev').click();if(e.key==='ArrowRight')lb.querySelector('.next').click()});try{const r=await fetch('/api/public/albums');if(!r.ok)throw Error();const albums=await r.json();root.innerHTML='';if(!albums.length){root.innerHTML='<p class="empty">Aucun album publié pour le moment.</p>';return}for(const a of albums){const card=document.createElement('article');card.className='album';const firstImage=Array.isArray(a.photos)&&a.photos.length?(a.photos.find(ph=>ph.mime_type&&ph.mime_type.startsWith('image/'))||a.photos[0]):null;const cover=a.cover_url||(firstImage&&firstImage.public_url);if(cover){const im=document.createElement('img');im.src=cover;im.alt=a.title||'Album ActuScout';im.loading='lazy';card.appendChild(im)}const info=document.createElement('div');info.className='album-info';const small=document.createElement('small');small.textContent=a.event_date||'Album photo';const title=document.createElement('h2');title.textContent=a.title||'';const desc=document.createElement('p');desc.textContent=a.description||'';info.append(small,title,desc);if(Array.isArray(a.photos)&&a.photos.length){const thumbs=document.createElement('div');thumbs.className='thumbs';a.photos.slice(0,3).forEach((ph,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Voir la photo '+(i+1));const im=document.createElement('img');im.src=ph.public_url;im.alt='';im.loading='lazy';b.appendChild(im);b.onclick=()=>open(a.photos,i);thumbs.appendChild(b)});info.appendChild(thumbs);const more=document.createElement('button');more.className='open-gallery';more.textContent='Voir les '+a.photos.length+' photos';more.onclick=()=>open(a.photos,0);info.appendChild(more)}else if(a.source_url){const link=document.createElement('a');link.className='open-gallery';link.href=a.source_url;link.target='_blank';link.rel='noopener';link.textContent='Consulter la source';info.appendChild(link)}card.appendChild(info);root.appendChild(card)}}catch(e){root.innerHTML='<p class="empty">Impossible de charger les albums. Réessayez plus tard.</p>'}})();
</script></body></html>

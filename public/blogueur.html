<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace blogueur | ActuScout</title><style>body{margin:0;background:#f7f5f9;color:#241631;font:16px system-ui}.wrap{max-width:900px;margin:35px auto;padding:20px}.card{background:white;border:1px solid #e8e2ee;border-radius:14px;padding:24px;margin:15px 0}h1,h2{color:#35145b}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7cde1;border-radius:8px;font:inherit}textarea{min-height:180px}button{background:#35145b;color:white;padding:11px 16px;border:0;border-radius:8px;cursor:pointer;margin-top:12px}.hidden{display:none}.muted{color:#71677b}
/* Étape 3 — espace blogueur responsive */
*{box-sizing:border-box}.wrap{width:min(900px,calc(100% - 36px))}
.card{min-width:0;overflow-wrap:anywhere}input,textarea{max-width:100%;min-width:0}
@media(max-width:700px){.wrap{width:100%;margin:0;padding:12px}.card{padding:16px;margin:10px 0}button{width:100%;white-space:normal}}
@media(max-width:380px){body{font-size:15px}.card{padding:13px}h1{font-size:25px}}

</style></head><body><main class="wrap"><p><a href="/">← ActuScout</a></p><section id="login" class="card"><h1>Espace blogueur</h1><form id="loginForm"><label>E-mail</label><input name="email" type="email" required><label>Mot de passe</label><input name="password" type="password" required><button>Se connecter</button></form><p id="loginStatus"></p><p class="muted">Pas encore de compte ? <a href="/devenir-blogueur">Déposer une candidature</a>.</p></section><section id="dash" class="hidden"><div class="card"><h1>Bonjour <span id="name"></span></h1><p>Vos articles sont transmis à la rédaction. Ils ne sont publiés qu'après validation.</p><button id="logout">Déconnexion</button></div><div class="card"><h2>Sécurité du compte</h2><form id="passwordForm"><label>Mot de passe actuel</label><input name="current_password" type="password" autocomplete="current-password" required><label>Nouveau mot de passe (10 caractères minimum)</label><input name="new_password" type="password" minlength="10" autocomplete="new-password" required><button>Modifier mon mot de passe</button></form><p id="passwordStatus" role="status"></p></div><div class="card"><h2>Soumettre un article</h2><form id="article"><label>Titre</label><input name="title" required maxlength="220"><label>Rubrique</label><input name="category" maxlength="100"><label>Résumé</label><textarea name="excerpt" style="min-height:80px"></textarea><label>Contenu de l'article</label><textarea name="body" required></textarea><label>URL de la photo de couverture (facultatif)</label><input name="cover_url" type="url"><button>Envoyer à la rédaction</button></form><p id="articleStatus"></p></div><div class="card"><h2>Mes articles</h2><div id="mine"></div></div></section></main><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const response=await fetch('/api'+path,{credentials:'same-origin',...options,headers:{'content-type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Une erreur est survenue.');return data}
function message(selector,value){$(selector).textContent=value}
async function load(){try{const articles=await api('/blogger/articles');$('#mine').innerHTML=articles.length?articles.map(a=>'<article style="padding:12px 0;border-bottom:1px solid #e8e2ee"><b>'+esc(a.title)+'</b><p>'+esc(a.status||'En attente')+'</p></article>').join(''):'<p class="muted">Aucun article soumis.</p>'}catch(error){message('#mine',error.message)}}
function showDashboard(profile){$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');$('#name').textContent=profile.name||'';load()}
async function checkSession(){try{const profile=await api('/blogger/me');showDashboard(profile)}catch(error){/* Session absente : le formulaire de connexion reste visible. */}}
$('#loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;message('#loginStatus','Connexion en cours…');try{const profile=await api('/blogger/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});message('#loginStatus','Connexion réussie.');showDashboard(profile.blogger||profile.user||{})}catch(error){message('#loginStatus',error.message)}finally{button.disabled=false}});
$('#article').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;message('#articleStatus','Envoi en cours…');try{const result=await api('/blogger/articles',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});message('#articleStatus',result.message||'Article transmis à la rédaction pour validation.');event.target.reset();await load()}catch(error){message('#articleStatus',error.message)}finally{button.disabled=false}});
$('#passwordForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;message('#passwordStatus','Modification en cours…');try{const result=await api('/blogger/password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(event.target)))});message('#passwordStatus',result.message||'Mot de passe modifié.');event.target.reset()}catch(error){message('#passwordStatus',error.message)}finally{button.disabled=false}});
$('#logout').addEventListener('click',async()=>{try{await api('/blogger/logout',{method:'POST',body:'{}'})}finally{location.reload()}});
checkSession();
</script></body></html>

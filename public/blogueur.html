<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace blogueur | ActuScout</title><style>body{margin:0;background:#f7f5f9;color:#241631;font:16px system-ui}.wrap{max-width:900px;margin:35px auto;padding:20px}.card{background:white;border:1px solid #e8e2ee;border-radius:14px;padding:24px;margin:15px 0}h1,h2{color:#35145b}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7cde1;border-radius:8px;font:inherit}textarea{min-height:180px}button{background:#35145b;color:white;padding:11px 16px;border:0;border-radius:8px;cursor:pointer;margin-top:12px}.hidden{display:none}.muted{color:#71677b}</style></head><body><main class="wrap"><p><a href="/">← ActuScout</a></p><section id="login" class="card"><h1>Espace blogueur</h1><form id="loginForm"><label>E-mail</label><input name="email" type="email" required><label>Mot de passe</label><input name="password" type="password" required><button>Se connecter</button></form><p id="loginStatus"></p><p class="muted">Pas encore de compte ? <a href="/devenir-blogueur.html">Déposer une candidature</a>.</p></section><section id="dash" class="hidden"><div class="card"><h1>Bonjour <span id="name"></span></h1><p>Vos articles sont transmis à la rédaction. Ils ne sont publiés qu'après validation.</p><button id="logout">Déconnexion</button></div><div class="card"><h2>Soumettre un article</h2><form id="article"><label>Titre</label><input name="title" required maxlength="220"><label>Rubrique</label><input name="category" maxlength="100"><label>Résumé</label><textarea name="excerpt" style="min-height:80px"></textarea><label>Contenu de l'article</label><textarea name="body" required></textarea><label>URL de la photo de couverture (facultatif)</label><input name="cover_url" type="url"><button>Envoyer à la rédaction</button></form><p id="articleStatus"></p></div><div class="card"><h2>Mes articles</h2><div id="mine"></div></div></section></main><script>const $=s=>document.querySelector(s),api=(p,o={})=>fetch('/api'+p,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function start(){const r=await api('/blogger/me');if(!r.ok)return;const b=await r.json();$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');$('#name').textContent=b.name;load()}async function load(){const r=await api('/blogger/articles');if(r.ok){const a=await r.json();$('#mine').innerHTML=a.map(x=>'<p><b>'+esc(x.title)+'</b> — '+esc(x.status)+'</p>').join('')||'<p class="muted">Aucun article soumis.</p>'}}$('#loginForm').onsubmit=async e=>{e.preventDefault();const r=await api('/blogger/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();$('#loginStatus').textContent=r.ok?'Connexion réussie.':d.error;if(r.ok)start()};$('#article').onsubmit=async e=>{e.preventDefault();const r=await api('/blogger/articles',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();$('#articleStatus').textContent=r.ok?d.message:d.error;if(r.ok){e.target.reset();load()}};$('#logout').onclick=async()=>{await api('/blogger/logout',{method:'POST'});location.reload()};start();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidatures blogueurs | ActuScout</title><style>body{margin:0;background:#f7f5f9;color:#241631;font:15px system-ui}.wrap{max-width:1050px;margin:30px auto;padding:18px}.card{background:white;border:1px solid #e8e2ee;border-radius:12px;padding:20px;margin:12px 0}h1{color:#35145b}button{border:0;border-radius:7px;padding:9px 13px;margin:4px;cursor:pointer;background:#35145b;color:white}.reject{background:#9f273c}.muted{color:#71677b;white-space:pre-wrap}</style></head><body><main class="wrap"><p><a href="/admin">← Administration</a></p><h1>Candidatures blogueurs</h1><p id="status">Vérification de la session administrateur…</p><div id="list"></div><h1>Blogueurs enregistrés</h1><div id="bloggers"></div></main><script>const $=s=>document.querySelector(s);async function load(){const r=await fetch('/api/admin/blogger-applications');if(!r.ok){$('#status').textContent='Connecte-toi d’abord à l’administration ActuScout.';return}const a=await r.json();$('#status').textContent=a.length+' candidature(s)';$('#list').innerHTML=a.map(x=>'<article class="card"><h2>'+esc(x.name)+'</h2><p>'+esc(x.email)+' · '+esc(x.phone)+' · '+esc(x.city)+'</p><p class="muted">'+esc(x.motivation)+'</p><p>Statut : '+esc(x.status)+' · <a target="_blank" href="'+esc(x.cv_url)+'">Ouvrir le CV PDF</a></p>'+(x.status==='pending'?'<button data-id="'+esc(x.id)+'" data-status="accepted">Accepter</button><button class="reject" data-id="'+esc(x.id)+'" data-status="rejected">Refuser</button>':'')+'</article>').join('')||'<p>Aucune candidature.</p>'}async function loadBloggers(){const r=await fetch('/api/admin/bloggers');if(!r.ok)return;const a=await r.json();$('#bloggers').innerHTML=a.map(x=>'<article class="card"><b>'+esc(x.name)+'</b><p>'+esc(x.email)+' · '+esc(x.phone)+' · Statut : '+esc(x.status)+'</p><button data-blogger="'+esc(x.id)+'" data-status="'+(x.status==='active'?'suspended':'active')+'">'+(x.status==='active'?'Suspendre le compte':'Réactiver le compte')+'</button></article>').join('')||'<p>Aucun compte blogueur.</p>'}document.addEventListener('click',async e=>{const b=e.target.closest('[data-blogger]');if(!b)return;const r=await fetch('/api/admin/bloggers/'+b.dataset.blogger+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:b.dataset.status})});if(!r.ok){alert('Impossible de modifier ce compte.');return}loadBloggers()});function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}document.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;if(!confirm('Confirmer cette décision ?'))return;const r=await fetch('/api/admin/blogger-applications/'+b.dataset.id+'/decision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:b.dataset.status})}),d=await r.json();if(!r.ok){alert(d.error||'Erreur');return}if(d.temporaryPassword)alert('Compte créé pour le candidat. Mot de passe temporaire à transmettre en privé : '+d.temporaryPassword);load()});loadBloggers();load();</script></body></html>

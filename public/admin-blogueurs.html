<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidatures blogueurs | ActuScout</title><style>body{margin:0;background:#f7f5f9;color:#241631;font:15px system-ui}.wrap{max-width:1050px;margin:30px auto;padding:18px}.card{background:white;border:1px solid #e8e2ee;border-radius:12px;padding:20px;margin:12px 0}h1{color:#35145b}button{border:0;border-radius:7px;padding:9px 13px;margin:4px;cursor:pointer;background:#35145b;color:white}.reject{background:#9f273c}.muted{color:#71677b;white-space:pre-wrap}
/* Étape 3 — candidatures responsive */
*{box-sizing:border-box} .wrap{width:min(1050px,calc(100% - 36px))}
.card{min-width:0;overflow-wrap:anywhere}.card button{max-width:100%;white-space:normal}
@media(max-width:700px){.wrap{width:100%;margin:0;padding:12px}.card{padding:15px;margin:10px 0}.card button{width:100%;margin:5px 0}}

</style><link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head><body><main class="wrap"><p><a href="/admin">← Administration</a></p><h1>Candidatures blogueurs</h1><p id="status">Vérification de la session administrateur…</p><div id="list"></div><h1>Utilisateurs et permissions</h1><p id="trainingSummary" class="muted"></p><div id="bloggers"></div><section id="permissionPanel" class="card" hidden><h2>Permissions du blogueur</h2><p id="permissionName"></p><div id="permissionFields"></div><button id="savePermissions">Enregistrer les permissions</button><button id="closePermissions" class="reject">Fermer</button><p id="permissionStatus" class="muted"></p></section></main><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options,headers:{'content-type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'La requête a échoué.');return d}
async function load(){const status=$('#status');status.textContent='Chargement des candidatures…';try{const applications=await request('/api/admin/blogger-applications');status.textContent=applications.length+' candidature(s)';$('#list').innerHTML=applications.map(x=>'<article class="card"><h2>'+esc(x.name)+'</h2><p>'+esc(x.email)+' · '+esc(x.phone)+' · '+esc(x.city)+'</p><p class="muted">'+esc(x.motivation)+'</p><p>Statut : '+esc(x.status)+' · <a target="_blank" rel="noopener" href="'+esc(x.cv_url)+'">Ouvrir le CV PDF</a></p>'+(x.status==='pending'?'<button data-id="'+esc(x.id)+'" data-status="accepted">Accepter</button><button class="reject" data-id="'+esc(x.id)+'" data-status="rejected">Refuser</button>':'')+'</article>').join('')||'<p>Aucune candidature.</p>'}catch(error){status.textContent=error.message;$('#list').innerHTML=''}}
const permissionLabels={write_articles:'Rédiger des articles',edit_own_articles:'Modifier ses articles',publish_articles:'Publier sans validation',manage_albums:'Gérer les albums',manage_carousel:'Gérer le carrousel',feature_articles:'Gérer les articles à la une',import_word:'Importer des articles Word',manage_bloggers:'Gérer les blogueurs'};let selectedBlogger=null;async function loadBloggers(){try{const accounts=await request('/api/admin/bloggers'),training=await request('/api/admin/bloggers/training'),progress=Object.fromEntries(training.map(x=>[x.id,x.completed]));$('#trainingSummary').textContent='Formation terminée : '+training.filter(x=>x.completed===6).length+' / '+training.length+' blogueur(s).';$('#bloggers').innerHTML=accounts.map(x=>'<article class="card"><b>'+esc(x.name)+'</b><p>'+esc(x.email)+' · '+esc(x.phone)+' · Statut : '+esc(x.status)+' · Formation : '+(progress[x.id]||0)+'/6</p><button data-permissions="'+esc(x.id)+'" data-name="'+esc(x.name)+'">Configurer les permissions</button><button data-blogger="'+esc(x.id)+'" data-status="'+(x.status==='active'?'suspended':'active')+'">'+(x.status==='active'?'Suspendre le compte':'Réactiver le compte')+'</button></article>').join('')||'<p>Aucun compte blogueur.</p>'}catch(error){$('#bloggers').textContent=error.message}}async function openPermissions(id,name){selectedBlogger=id;$('#permissionName').textContent=name;const values=await request('/api/admin/bloggers/permissions?blogger_id='+encodeURIComponent(id));$('#permissionFields').innerHTML=Object.entries(permissionLabels).map(([key,label])=>'<label style="display:flex;gap:10px;align-items:center"><input style="width:auto" type="checkbox" data-perm="'+key+'" '+(values[key]?'checked':'')+'> '+label+'</label>').join('');$('#permissionPanel').hidden=false;$('#permissionStatus').textContent=''}$('#savePermissions').onclick=async()=>{const permissions=Object.fromEntries([...document.querySelectorAll('[data-perm]')].map(x=>[x.dataset.perm,x.checked]));try{await request('/api/admin/bloggers/permissions',{method:'PUT',body:JSON.stringify({blogger_id:selectedBlogger,permissions})});$('#permissionStatus').textContent='Permissions enregistrées.'}catch(error){$('#permissionStatus').textContent=error.message}};$('#closePermissions').onclick=()=>$('#permissionPanel').hidden=true;
document.addEventListener('click',async event=>{const perm=event.target.closest('[data-permissions]');if(perm){try{await openPermissions(perm.dataset.permissions,perm.dataset.name)}catch(error){alert(error.message)}return}const account=event.target.closest('[data-blogger]');if(account){const status=account.dataset.status;if(!confirm(status==='suspended'?'Suspendre ce compte blogueur ?':'Réactiver ce compte blogueur ?'))return;account.disabled=true;try{await request('/api/admin/bloggers/'+encodeURIComponent(account.dataset.blogger)+'/status',{method:'POST',body:JSON.stringify({status})});await loadBloggers()}catch(error){alert(error.message);account.disabled=false}return}
const decision=event.target.closest('[data-id]');if(!decision||!confirm(decision.dataset.status==='accepted'?'Accepter cette candidature et créer un compte blogueur ?':'Refuser cette candidature ?'))return;decision.disabled=true;try{const result=await request('/api/admin/blogger-applications/'+encodeURIComponent(decision.dataset.id)+'/decision',{method:'POST',body:JSON.stringify({status:decision.dataset.status})});if(result.temporaryPassword)alert('Compte créé. Mot de passe temporaire à transmettre au candidat par un canal privé : '+result.temporaryPassword);await load();await loadBloggers()}catch(error){alert(error.message);decision.disabled=false}});
load();loadBloggers();
</script></body></html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#35145b">
<title>Article | ActuScout</title>
<meta name="description" content="Lire les actualités du scoutisme sur ActuScout.">
<style>
:root{--violet:#35145b;--violet2:#5c318a;--ink:#241631;--muted:#746b7c;--paper:#fff;--line:#e9e3ef;--soft:#f7f4fa}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.65}
a{color:inherit}
.topbar{height:66px;background:var(--violet);color:#fff;display:flex;align-items:center}
.topbar-inner{width:min(1160px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.04em;font-size:19px}
.back{display:inline-flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.35);padding:8px 13px;border-radius:4px}
.back:hover{background:rgba(255,255,255,.12)}
main{width:min(1060px,calc(100% - 40px));margin:0 auto;padding:34px 0 70px}
.article-head{max-width:900px;margin:0 auto 25px}
.eyebrow{color:var(--violet2);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(30px,5vw,54px);line-height:1.12;letter-spacing:-.035em;margin:0 0 17px;color:var(--violet);font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
.cover-wrap{width:100%;height:clamp(260px,53vw,590px);background:#eee8f4;overflow:hidden;margin:28px 0 36px;border-radius:5px}
.cover{width:100%;height:100%;display:block;object-fit:cover}
.article-layout{max-width:820px;margin:0 auto}
.article-content{font-size:18px;line-height:1.85;color:#30283a;overflow-wrap:anywhere}
.article-content p{margin:0 0 1.35em}
.article-content h2,.article-content h3,.article-content h4{color:var(--violet);line-height:1.25;margin:1.8em 0 .7em}
.article-content h2{font-size:30px}.article-content h3{font-size:24px}.article-content h4{font-size:20px}
.article-content img{display:block;max-width:100%;height:auto;margin:26px auto;border-radius:4px}
.article-content a{color:var(--violet2);text-decoration:underline}
.article-content blockquote{border-left:4px solid var(--violet2);margin:28px 0;padding:8px 20px;background:var(--soft);color:#51465d}
.article-content ul,.article-content ol{padding-left:26px;margin:0 0 1.4em}
.article-content hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.interactions{max-width:820px;margin:32px auto 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:14px}.interaction-button,.interaction-stat{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font:inherit}.interaction-button{border:0;background:transparent;padding:5px 0;cursor:pointer}.interaction-button:disabled{opacity:.5;cursor:wait}.interaction-button svg,.interaction-stat svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.interaction-button strong{font-size:13px;font-weight:700}.interaction-button.is-liked{color:var(--violet2)}.interaction-button.is-liked svg,.interaction-button.is-saved svg{fill:currentColor}.interaction-feedback{font-size:12px;color:var(--muted)}
.related{margin-top:70px;padding-top:32px;border-top:1px solid var(--line)}
.related-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.related-kicker{color:var(--violet2);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.related h2{font-size:clamp(24px,3vw,32px);line-height:1.2;color:var(--violet);margin:5px 0 0}
.related-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.related-card{display:block;text-decoration:none;border:1px solid var(--line);background:#fff;min-width:0;transition:transform .18s ease,box-shadow .18s ease}
.related-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(35,17,55,.1)}
.related-card img,.related-placeholder{width:100%;height:185px;object-fit:cover;display:block;background:linear-gradient(135deg,#35145b,#76549b)}
.related-copy{padding:16px}
.related-category{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--violet2);font-weight:800}
.related-card h3{font-size:18px;line-height:1.35;color:var(--ink);margin:7px 0 0}
.state{max-width:760px;margin:70px auto;text-align:center;padding:35px 20px;background:var(--soft);color:var(--muted)}
.state h1{font-size:30px}
@media(max-width:700px){.topbar{height:60px}.topbar-inner{width:calc(100% - 28px)}main{width:calc(100% - 28px);padding:25px 0 48px}.cover-wrap{height:clamp(230px,70vw,390px);margin:22px 0 27px}.article-content{font-size:17px;line-height:1.78}.related{margin-top:48px}.related-grid{grid-template-columns:1fr;gap:14px}.related-card{display:grid;grid-template-columns:112px minmax(0,1fr)}.related-card img,.related-placeholder{height:100%;min-height:118px}.related-copy{padding:12px}.related-card h3{font-size:16px}.related-head{display:block}}
@media(prefers-reduced-motion:reduce){.related-card{transition:none}}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/">ACTUSCOUT</a><a class="back" id="backLink" href="/">← Retour aux actualités</a></div></header>
<main id="main"><div class="state" role="status">Chargement de l’article…</div></main>
<script>
const main=document.getElementById('main');
const params=new URLSearchParams(location.search);
const articleId=params.get('id');
document.getElementById('backLink').addEventListener('click',function(event){if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){event.preventDefault();history.back()}});
function safeContent(target,source){
 const parsed=new DOMParser().parseFromString(String(source||''),'text/html');
 const allowed=new Set(['P','BR','DIV','SPAN','STRONG','B','EM','I','U','UL','OL','LI','H2','H3','H4','BLOCKQUOTE','A','IMG','HR']);
 const cleanNode=node=>{
  if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.textContent||'');
  if(node.nodeType!==Node.ELEMENT_NODE)return document.createDocumentFragment();
  if(!allowed.has(node.tagName)){const fragment=document.createDocumentFragment();node.childNodes.forEach(child=>fragment.appendChild(cleanNode(child)));return fragment}
  const el=document.createElement(node.tagName.toLowerCase());
  if(node.tagName==='A'){const href=node.getAttribute('href')||'';if(/^https?:\/\//i.test(href)){el.href=href;el.target='_blank';el.rel='noopener noreferrer'}}
  if(node.tagName==='IMG'){const src=node.getAttribute('src')||'';if(!/^https?:\/\//i.test(src))return document.createDocumentFragment();el.src=src;el.alt=node.getAttribute('alt')||'';el.loading='lazy'}
  node.childNodes.forEach(child=>el.appendChild(cleanNode(child)));
  return el;
 };
 const fragment=document.createDocumentFragment();parsed.body.childNodes.forEach(node=>fragment.appendChild(cleanNode(node)));target.replaceChildren(fragment);
}
function dateLabel(value){if(!value)return '';const raw=String(value).trim();const normalized=/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(raw)?raw.replace(' ','T')+'Z':raw;const d=new Date(normalized);return Number.isNaN(d.getTime())?raw:new Intl.DateTimeFormat('fr-FR',{dateStyle:'long',timeZone:'UTC'}).format(d)}
function openArticle(id){location.href='/article?id='+encodeURIComponent(id)}
function renderRelated(current,all){
 const related=all.filter(a=>a.id!==current.id).sort((a,b)=>{
  const ac=(a.category||'').toLocaleLowerCase()===(current.category||'').toLocaleLowerCase()?1:0;
  const bc=(b.category||'').toLocaleLowerCase()===(current.category||'').toLocaleLowerCase()?1:0;
  return bc-ac;
 }).slice(0,3);
 if(!related.length)return null;
 const section=document.createElement('section');section.className='related';
 const head=document.createElement('div');head.className='related-head';
 const heading=document.createElement('div');const kicker=document.createElement('div');kicker.className='related-kicker';kicker.textContent='Pour prolonger la lecture';
 const title=document.createElement('h2');title.textContent='À lire également';heading.append(kicker,title);head.append(heading);
 const grid=document.createElement('div');grid.className='related-grid';
 related.forEach(item=>{
  const link=document.createElement('a');link.className='related-card';link.href='/article?id='+encodeURIComponent(item.id);
  if(item.cover_url){const img=document.createElement('img');img.src=item.cover_url;img.alt=item.title||'Couverture';img.loading='lazy';img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('div'),{className:'related-placeholder'}))};link.appendChild(img)}
  else{const placeholder=document.createElement('div');placeholder.className='related-placeholder';link.appendChild(placeholder)}
  const copy=document.createElement('div');copy.className='related-copy';const cat=document.createElement('div');cat.className='related-category';cat.textContent=item.category||'Actualité';const h=document.createElement('h3');h.textContent=item.title||'Article ActuScout';copy.append(cat,h);link.appendChild(copy);grid.appendChild(link);
 });
 section.append(head,grid);return section;
}
async function load(){
 if(!articleId){main.innerHTML='<div class="state"><h1>Article introuvable</h1><p>Aucun identifiant d’article n’a été fourni.</p><a href="/">Retour aux actualités</a></div>';return}
 try{
  const response=await fetch('/api/public/articles/'+encodeURIComponent(articleId),{headers:{accept:'application/json'},cache:'no-store'});
  if(!response.ok)throw new Error('Impossible de charger cet article');
  const article=await response.json();
  if(!article){main.innerHTML='<div class="state"><h1>Article introuvable</h1><p>Cet article n’est plus disponible ou son lien est incorrect.</p><a href="/">Retour aux actualités</a></div>';return}
  document.title=(article.title||'Article')+' | ActuScout';
  const description=document.querySelector('meta[name="description"]');if(description)description.content=article.excerpt||article.title||'Lire ActuScout';
  main.replaceChildren();
  const header=document.createElement('header');header.className='article-head';
  const category=document.createElement('div');category.className='eyebrow';category.textContent=article.category||'Actualité';
  const title=document.createElement('h1');title.textContent=article.title||'Article ActuScout';
  const meta=document.createElement('div');meta.className='meta';
  const author=document.createElement('span');author.textContent='Par '+(article.author||'Rédaction ActuScout');
  const date=document.createElement('span');date.textContent=dateLabel(article.original_published_at||article.created_at);
  meta.append(author);if(date.textContent)meta.append(date);header.append(category,title,meta);main.appendChild(header);
  if(article.cover_url){const coverWrap=document.createElement('div');coverWrap.className='cover-wrap';const img=document.createElement('img');img.className='cover';img.src=article.cover_url;img.alt=article.title||'Couverture de l’article';img.fetchPriority='high';img.onerror=()=>coverWrap.remove();coverWrap.appendChild(img);main.appendChild(coverWrap)}
  const layout=document.createElement('article');layout.className='article-layout';
  const content=document.createElement('div');content.className='article-content';safeContent(content,article.body||article.excerpt||'');
  layout.appendChild(content);main.appendChild(layout);
  const interactions=document.createElement('section');interactions.className='interactions';interactions.setAttribute('aria-label','Interactions avec cet article');
  interactions.innerHTML='<button type="button" class="interaction-button" id="likeButton" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.7c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.3Z"/></svg><span>J’aime</span><strong id="likeCount">0</strong></button><span class="interaction-stat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg><span id="viewCount">0</span> lectures</span><button type="button" class="interaction-button" id="bookmarkButton" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.8h12v17l-6-4-6 4Z"/></svg><span>Enregistrer</span><strong id="bookmarkCount">0</strong></button><a class="interaction-button" id="commentsLink" href="#comments" style="text-decoration:none"><span>Commentaires</span><strong id="commentCount">0</strong></a><button type="button" class="interaction-button" id="shareButton"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.3 10.8 7.4-4.6m-7.4 9 7.4 4.6"/></svg><span>Partager</span><strong id="shareCount">0</strong></button><span class="interaction-feedback" id="interactionFeedback" role="status" aria-live="polite"></span>';
  main.appendChild(interactions);
  const commentsSection=document.createElement('section');commentsSection.id='comments';commentsSection.className='article-layout';commentsSection.style.cssText='margin:42px auto 0;padding-top:24px;border-top:1px solid var(--line)';
  commentsSection.innerHTML='<h2 style="color:var(--violet);font-size:25px">Commentaires</h2><p id="commentNotice" class="interaction-feedback" role="status" aria-live="polite"></p><div id="commentList"></div><form id="commentForm" style="margin-top:22px"><label for="commentName" style="display:block;font-weight:700;margin:10px 0 5px">Ton nom</label><input id="commentName" name="name" maxlength="70" required style="width:100%;padding:12px;border:1px solid var(--line);border-radius:5px;font:inherit"><label for="commentContent" style="display:block;font-weight:700;margin:12px 0 5px">Ton commentaire</label><textarea id="commentContent" name="content" maxlength="2000" required rows="4" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:5px;font:inherit;resize:vertical"></textarea><button type="submit" class="interaction-button" style="background:var(--violet);color:#fff;padding:10px 16px;border-radius:4px;margin-top:10px">Envoyer le commentaire</button><p class="interaction-feedback">Ton commentaire sera publié après validation par l’équipe ActuScout.</p></form>';
  main.appendChild(commentsSection);
  const likeButton=interactions.querySelector('#likeButton'),shareButton=interactions.querySelector('#shareButton'),bookmarkButton=interactions.querySelector('#bookmarkButton'),feedback=interactions.querySelector('#interactionFeedback');
  const statsUrl='/api/public/articles/'+encodeURIComponent(article.id);
  const setCounts=stats=>{interactions.querySelector('#likeCount').textContent=Number(stats.likes||0).toLocaleString('fr-FR');interactions.querySelector('#viewCount').textContent=Number(stats.views||0).toLocaleString('fr-FR');interactions.querySelector('#shareCount').textContent=Number(stats.shares||0).toLocaleString('fr-FR');interactions.querySelector('#bookmarkCount').textContent=Number(stats.bookmarks||0).toLocaleString('fr-FR');interactions.querySelector('#commentCount').textContent=Number(stats.comments||0).toLocaleString('fr-FR');likeButton.setAttribute('aria-pressed',String(!!stats.liked));likeButton.classList.toggle('is-liked',!!stats.liked);bookmarkButton.setAttribute('aria-pressed',String(!!stats.bookmarked));bookmarkButton.classList.toggle('is-saved',!!stats.bookmarked)};
  try{
   const initial=await fetch(statsUrl+'/metrics',{headers:{accept:'application/json'},cache:'no-store'});if(!initial.ok)throw new Error('Statistiques indisponibles');setCounts(await initial.json());
   const viewed=await fetch(statsUrl+'/view',{method:'POST',headers:{accept:'application/json'}});if(viewed.ok)setCounts(await viewed.json());
   bookmarkButton.addEventListener('click',async()=>{bookmarkButton.disabled=true;try{const response=await fetch(statsUrl+'/bookmark',{method:'POST',headers:{accept:'application/json'}});if(!response.ok)throw new Error();setCounts(await response.json())}catch{feedback.textContent='Impossible d’enregistrer cet article.'}finally{bookmarkButton.disabled=false}});
   const commentList=commentsSection.querySelector('#commentList'),commentNotice=commentsSection.querySelector('#commentNotice'),commentForm=commentsSection.querySelector('#commentForm');
   const loadComments=async()=>{const response=await fetch(statsUrl+'/comments',{headers:{accept:'application/json'},cache:'no-store'});if(!response.ok)throw new Error();const data=await response.json();commentList.replaceChildren();if(!data.comments?.length){const empty=document.createElement('p');empty.className='interaction-feedback';empty.textContent='Aucun commentaire publié pour le moment.';commentList.appendChild(empty)}else data.comments.forEach(item=>{const box=document.createElement('article');box.style.cssText='padding:14px 0;border-bottom:1px solid var(--line)';const author=document.createElement('strong');author.textContent=item.author_name;const content=document.createElement('p');content.style.margin='6px 0 0';content.textContent=item.content;box.append(author,content);commentList.appendChild(box)});};
   loadComments().catch(()=>{commentNotice.textContent='Impossible de charger les commentaires pour le moment.'});
   commentForm.addEventListener('submit',async event=>{event.preventDefault();const submit=commentForm.querySelector('button[type="submit"]');submit.disabled=true;commentNotice.textContent='Envoi en cours…';try{const payload=Object.fromEntries(new FormData(commentForm).entries()),response=await fetch(statsUrl+'/comments',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw new Error(data.error||'Envoi impossible.');commentForm.reset();commentNotice.textContent=data.message||'Commentaire envoyé pour modération.'}catch(error){commentNotice.textContent=error.message||'Impossible d’envoyer le commentaire.'}finally{submit.disabled=false}});
   likeButton.addEventListener('click',async()=>{likeButton.disabled=true;try{const response=await fetch(statsUrl+'/like',{method:'POST',headers:{accept:'application/json'}});if(!response.ok)throw new Error();setCounts(await response.json())}catch{feedback.textContent='Impossible d’enregistrer votre réaction.'}finally{likeButton.disabled=false}});
   shareButton.addEventListener('click',async()=>{const shareData={title:article.title||'ActuScout',text:article.excerpt||article.title||'',url:location.href};try{if(navigator.share)await navigator.share(shareData);else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(shareData.url);feedback.textContent='Lien copié.'}else{feedback.textContent='Copiez l’adresse de cette page pour la partager.';return}const response=await fetch(statsUrl+'/share',{method:'POST',headers:{accept:'application/json'}});if(response.ok)setCounts(await response.json())}catch(error){if(error.name!=='AbortError')feedback.textContent='Le partage n’a pas pu être enregistré.'}});
  }catch(error){likeButton.disabled=true;shareButton.disabled=true;feedback.textContent='Les statistiques sont momentanément indisponibles.'}
  try {
   const relatedResponse=await fetch('/api/public/articles?limit=10&page=1',{headers:{accept:'application/json'},cache:'no-store'});
   if(relatedResponse.ok){
    const relatedPayload=await relatedResponse.json();
    const related=renderRelated(article,Array.isArray(relatedPayload.articles)?relatedPayload.articles:[]);
    if(related)main.appendChild(related);
   }
  } catch(relatedError) {
   console.warn('ActuScout — articles associés indisponibles:',relatedError);
  }
 }catch(error){console.error('ActuScout — lecture article:',error);main.innerHTML='<div class="state"><h1>Article momentanément indisponible</h1><p>Une erreur empêche le chargement de cet article. Réessayez dans quelques instants.</p><a href="/">Retour aux actualités</a></div>'}
}
load();
</script>
</body>
</html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Module de formation | ActuScout</title><link rel="icon" href="/favicon.svg"><style>body{margin:0;background:#321b59;color:white;font:16px/1.7 system-ui}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:white;color:#2b2035;border-radius:12px;padding:24px}label{display:block;margin:8px 0}textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px}button{background:#452779;color:white;border:0;padding:10px 15px;border-radius:6px;margin-top:10px}.muted{color:#d8cde7}</style></head><body><main class="wrap"><p><a href="/modules-formation" style="color:white">← Tous les modules</a></p><article id="content" class="card">Chargement…</article><section class="card" style="margin-top:18px"><h2>Proposer une amélioration</h2><p>Connectez-vous à votre compte ActuScout pour soumettre une suggestion ou une correction. <a href="/blogueur">Ouvrir mon espace de connexion</a>. Votre contribution sera vérifiée avant publication.</p><form id="contribute"><label>Type de contribution</label><select name="contribution_type"><option value="suggestion">Suggestion</option><option value="correction">Correction</option></select><label>Votre proposition</label><textarea name="content" required maxlength="5000"></textarea><button>Envoyer à la modération</button></form><p id="status" role="status"></p></section></main><script>const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('content'),esc=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let moduleData;async function load(){const r=await fetch('/api/public/training-modules/'+encodeURIComponent(id));if(!r.ok){box.textContent='Module introuvable.';return}moduleData=await r.json();box.innerHTML='<small>'+esc(moduleData.category)+'</small><h1>'+esc(moduleData.title)+'</h1><p>'+esc(moduleData.summary)+'</p>'+(moduleData.media_type&&moduleData.media_type.startsWith('image/')?'<img src="'+esc(moduleData.media_url)+'" style="max-width:100%;border-radius:8px">':moduleData.media_type==='application/pdf'?'<p><a href="'+esc(moduleData.media_url)+'" target="_blank" rel="noopener">Consulter le document PDF</a></p>':'')+'<div>'+moduleData.body+'</div><section><h2>Contributions validées</h2>'+(moduleData.contributions||[]).map(c=>'<article><b>'+esc(c.contribution_type==='correction'?'Correction':'Suggestion')+'</b><p>'+esc(c.content)+'</p></article>').join('')+'</section>'}document.getElementById('contribute').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{const r=await fetch('/api/trainer/modules/'+encodeURIComponent(id)+'/contributions',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(!r.ok)throw Error(d.error||'Connexion requise');document.getElementById('status').textContent=d.message;f.reset()}catch(x){document.getElementById('status').textContent=x.message}};load();</script></body></html>

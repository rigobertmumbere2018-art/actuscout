<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprendre le scoutisme | ActuScout</title><meta name="description" content="Modules pédagogiques pour découvrir et comprendre le scoutisme."><link rel="canonical" href="https://actuscout.com/modules-formation"><link rel="icon" href="/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#321b59;color:white;font:16px/1.6 system-ui}.wrap{max-width:1120px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:#fff;color:#452779;border-radius:12px;overflow:hidden;padding:18px}.card h2{margin:4px 0}.card a{color:#452779;font-weight:700}.card img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}.muted{color:#d8cde7}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p><a href="/" style="color:white">← ActuScout</a></p><h1>Comprendre le scoutisme</h1><p class="muted">Des modules pédagogiques pour apprendre, transmettre et approfondir les pratiques du mouvement scout.</p><div id="modules" class="grid">Chargement des modules…</div></main><script>const esc=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){const box=document.getElementById('modules');try{const r=await fetch('/api/public/training-modules',{cache:'no-store'});if(!r.ok)throw Error();const rows=await r.json();box.innerHTML=rows.map(x=>'<article class="card">'+(x.media_type&&x.media_type.startsWith('image/')?'<img src="'+esc(x.media_url)+'" alt="">':'')+'<h2>'+esc(x.title)+'</h2><p>'+esc(x.category)+'</p><p>'+esc(x.summary)+'</p><a href="/module?id='+encodeURIComponent(x.id)+'">Consulter le module →</a></article>').join('')||'<p>Aucun module publié pour le moment.</p>'}catch{box.textContent='Les modules sont momentanément indisponibles.'}}load();</script></body></html>

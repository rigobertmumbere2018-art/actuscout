<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Archives des actualités | ActuScout</title><style>
:root{--purple:#321b59;--purple2:#452779;--lav:#cdbce3}*{box-sizing:border-box}body{margin:0;background:var(--purple);color:#fff;font:16px/1.55 Inter,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}header{background:#261342;padding:18px 0;border-bottom:1px solid #ffffff24}header a{color:white;text-decoration:none;font-weight:800;font-size:22px}.intro{padding:42px 0 24px}.intro p{color:#d8cde7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-bottom:28px}.card{display:flex;flex-direction:column;background:var(--purple2);border:1px solid #ffffff20;color:white;text-decoration:none;min-width:0}.photo{height:190px;background:linear-gradient(135deg,#321b59,#76549b);background-size:cover;background-position:center}.body{padding:18px}.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lav);font-weight:800}.body h2{font-size:21px;line-height:1.25;margin:9px 0}.body p{color:#eee5f8;margin:8px 0}.meta{font-size:12px;color:#cdbce3;margin-top:12px}.pager{display:flex;justify-content:center;align-items:center;gap:14px;padding:8px 0 45px}.pager button{border:0;background:#fff;color:var(--purple);font-weight:800;padding:12px 18px;border-radius:4px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}#status{color:#d8cde7}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.wrap{width:calc(100% - 24px)}.grid{grid-template-columns:1fr;gap:14px}.photo{height:210px}.intro{padding:26px 0 18px}.body h2{font-size:19px}}
</style><link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head><body><header><div class="wrap"><a href="/">ActuScout</a><span style="float:right"><a href="/" style="font-size:14px">Accueil</a></span></div></header><main class="wrap"><section class="intro"><p>LE FIL ACTUSCOUT</p><h1>Archives des actualités</h1><p>Retrouve les publications de la communauté scoute. Les articles sont présentés par ordre chronologique.</p></section><p id="status" aria-live="polite">Chargement des articles…</p><section id="articles" class="grid"></section><nav class="pager" aria-label="Pagination"><button id="previous" disabled>Précédent</button><span id="pageInfo">Page 1</span><button id="next" disabled>Suivant</button></nav></main><script>
const grid=document.querySelector('#articles'),status=document.querySelector('#status'),prev=document.querySelector('#previous'),next=document.querySelector('#next'),pageInfo=document.querySelector('#pageInfo');let page=1,pages=1;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){status.textContent='Chargement des articles…';grid.replaceChildren();try{const r=await fetch('/api/public/articles?limit=10&page='+page,{cache:'no-store'});if(!r.ok)throw Error('Impossible de charger les archives.');const d=await r.json();pages=d.pages||1;status.textContent=d.total?d.total+' article(s) publié(s)':'Aucun article publié pour le moment.';for(const a of d.articles||[]){const card=document.createElement('a');card.className='card';card.href='/article.html?id='+encodeURIComponent(a.id);const photo=document.createElement('div');photo.className='photo';if(a.cover_url)photo.style.backgroundImage='url("'+String(a.cover_url).replace(/["\\]/g,'')+'")';const body=document.createElement('div');body.className='body';const cat=document.createElement('div');cat.className='kicker';cat.textContent=a.category||'Actualité';const title=document.createElement('h2');title.textContent=a.title||'Article';const excerpt=document.createElement('p');excerpt.textContent=a.excerpt||String(a.body||'').replace(/<[^>]*>/g,' ').slice(0,180);const meta=document.createElement('div');meta.className='meta';meta.textContent=a.author||'Rédaction ActuScout';body.append(cat,title,excerpt,meta);card.append(photo,body);grid.append(card)}prev.disabled=page<=1;next.disabled=page>=pages;pageInfo.textContent='Page '+page+' / '+pages}catch(e){status.textContent=e.message;prev.disabled=true;next.disabled=true}}
prev.onclick=()=>{if(page>1){page--;load();window.scrollTo({top:0,behavior:'smooth'})}};next.onclick=()=>{if(page<pages){page++;load();window.scrollTo({top:0,behavior:'smooth'})}};load();
</script></body></html>

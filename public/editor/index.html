<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rédaction – ActuScout</title><link rel="stylesheet" href="/editor/css/editor.css"></head><body><div class="titlebar">ActuScout — Éditeur d’articles</div><div class="tabs"><button class="tab file" id="btnFichier">Fichier</button><button class="tab on" data-tab="accueil">Accueil</button><button class="tab" data-tab="affichage">Affichage</button></div><div id="menuFichier" class="menu hidden"><button data-act="nouveau">Nouvel article</button><button data-act="importer">Importer Word (.docx)</button><button data-act="enregistrer">Enregistrer le brouillon</button><button data-act="charger">Charger l’article</button><button data-act="publier" id="menuSubmit">Publier / Soumettre</button></div><div class="ribbon" id="tab-accueil"><div class="group"><button class="btn" data-cmd="bold"><b>Gras</b></button><button class="btn" data-cmd="italic"><i>Italique</i></button><button class="btn" data-cmd="underline"><u>Souligné</u></button><button class="btn" data-cmd="insertUnorderedList">Liste</button><button class="btn" data-cmd="insertOrderedList">Liste numérotée</button><select id="police"><option>Arial</option><option>Georgia</option><option>Calibri</option><option>Verdana</option></select><select id="taille"><option value="2">10</option><option value="3" selected>11</option><option value="4">14</option><option value="5">18</option><option value="6">24</option></select><input type="color" id="couleur" value="#1d2430"><input type="color" id="surlignage" value="#fff176"><button class="btn" id="btnTitre">Titre</button><button class="btn" id="btnImage">Insérer une image</button><button class="btn" id="btnWord">Importer Word</button><button class="btn" id="btnLien">Lien</button></div></div><div class="ribbon hidden" id="tab-affichage"><button class="btn" id="zoomIn">Zoom +</button><button class="btn" id="zoomOut">Zoom −</button><button class="btn" id="zo

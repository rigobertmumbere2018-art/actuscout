<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration des formateurs | ActuScout</title><link rel="icon" href="/favicon.svg"><style>body{margin:0;background:#f7f5f9;color:#241631;font:15px system-ui}.wrap{max-width:1100px;margin:25px auto;padding:18px}.card{background:white;border:1px solid #e8e2ee;border-radius:12px;padding:18px;margin:12px 0}h1,h2{color:#35145b}button{background:#35145b;color:white;border:0;border-radius:7px;padding:9px 13px;margin:4px;cursor:pointer}.reject{background:#9f273c}.muted{color:#71677b;white-space:pre-wrap}.row{display:flex;gap:12px;flex-wrap:wrap}</style></head><body><main class="wrap"><p><a href="/admin">← Administration</a></p><h1>Candidatures des formateurs</h1><p id="status">Chargement…</p><div id="applications"></div><h1>Modules en attente</h1><div id="modules"></div><h1>Suggestions et corrections en attente</h1><div id="contributions"></div></main><script>const $=s=>document.querySelector(s),esc=v=>String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function api(p,o={}){const r=await fetch('/api'+p,{credentials:'same-origin',...o,headers:{'content-type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}async function load(){try{const [apps,mods,cs]=await Promise.all([api('/admin/trainer-applications'),api('/admin/training-modules?status=pending'),api('/admin/module-contributions?status=pending')]);$('#status').textContent=apps.length+' candidature(s)';$('#applications').innerHTML=apps.map(a=>'<article class="card"><h2>'+esc(a.name)+'</h2><p>'+esc(a.email)+' · '+esc(a.phone)+'</p><p>Résidence : '+esc([a.country,a.city,a.neighborhood,a.avenue,a.street].join(', '))+'</p><p>Parcours scout : '+esc([a.scout_group,a.scout_district,a.scout_association,a.scout_federation].join(' · '))+'</p><p>'+esc(a.experience)+'</p><p>Statut : '+esc(a.status)+' · <a href="/api/admin/trainer-applications/'+encodeURIComponent(a.id)+'/cv" target="_blank">Ouvrir le CV scout (privé)</a></p>'+(a.status==='pending'?'<button data-app="'+esc(a.id)+'" data-status="approved">Approuver</button><button class="reject" data-app="'+esc(a.id)+'" data-status="rejected">Refuser</button>':'')+'</article>').join('')||'<p>Aucune candidature.</p>';$('#modules').innerHTML=mods.map(x=>'<article class="card"><h2>'+esc(x.title)+'</h2><p>'+esc(x.summary)+'</p><p class="muted">Formateur : '+esc(x.trainer_name)+'</p><div class="row"><button data-module="'+esc(x.id)+'" data-status="published">Publier</button><button class="reject" data-module="'+esc(x.id)+'" data-status="rejected">Refuser</button></div></article>').join('')||'<p>Aucun module en attente.</p>';$('#contributions').innerHTML=cs.map(x=>'<article class="card"><h2>'+esc(x.module_title)+'</h2><p>'+esc(x.contribution_type)+' — '+esc(x.content)+'</p><button data-contribution="'+esc(x.id)+'" data-status="approved">Valider la contribution</button><button class="reject" data-contribution="'+esc(x.id)+'" data-status="rejected">Refuser</button></article>').join('')||'<p>Aucune contribution en attente.</p>'}catch(e){$('#status').textContent=e.message}}document.addEventListener('click',async e=>{const t=e.target;if(t.dataset.app){if(!confirm('Confirmer cette décision ?'))return;try{const d=await api('/admin/trainer-applications/'+t.dataset.app+'/decision',{method:'POST',body:JSON.stringify({status:t.dataset.status})});if(d.temporaryPassword)alert('Compte créé. Mot de passe temporaire à transmettre par canal privé : '+d.temporaryPassword);await load()}catch(x){alert(x.message)}}if(t.dataset.module){try{await api('/admin/training-modules/'+t.dataset.module+'/decision',{method:'POST',body:JSON.stringify({status:t.dataset.status})});await load()}catch(x){alert(x.message)}}if(t.dataset.contribution){try{await api('/admin/module-contributions/'+t.dataset.contribution+'/decision',{method:'POST',body:JSON.stringify({status:t.dataset.status})});await load()}catch(x){alert(x.message)}}});load();</script></body></html>

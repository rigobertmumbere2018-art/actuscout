name: ActuScout audit tests

on:
  push:
    branches:
      - copilot/actuscout-audit-safe
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker JavaScript syntax
        run: node --check src/index.js

      - name: Run isolated Worker and static SEO tests
        run: node --test test/audit.test.mjs
